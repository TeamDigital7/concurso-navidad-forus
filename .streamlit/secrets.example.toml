# Copia este archivo como .streamlit/secrets.toml (no se versiona) o pega su contenido
# en Settings > Secrets de Streamlit Cloud. Sin secrets la app corre abierta y con datos de ejemplo.

# ---------------------------------------------------------------------------
# INICIO DE SESION CON MICROSOFT ENTRA ID (mismo esquema que sincronizacion-stock)
# ---------------------------------------------------------------------------
# En Entra ID: App registration tipo Web con redirect URI
#   https://<dominio-de-la-app>/oauth2callback   (y http://localhost:8501/oauth2callback para local)
# En la Enterprise Application activa "Assignment required" y asigna solo a los usuarios/grupos del concurso.
# Puedes reutilizar el registro de sincronizacion-stock agregando el nuevo redirect URI.
[auth]
redirect_uri = "https://TU-APLICACION.streamlit.app/oauth2callback"
cookie_secret = "VALOR_ALEATORIO_LARGO"

[auth.microsoft]
client_id = "APPLICATION_CLIENT_ID_DE_ENTRA"
client_secret = "CLIENT_SECRET_VALUE_DE_ENTRA"
server_metadata_url = "https://login.microsoftonline.com/DIRECTORY_TENANT_ID/v2.0/.well-known/openid-configuration"

# ---------------------------------------------------------------------------
# BIGQUERY (mismo esquema que catalogo-control-center)
# ---------------------------------------------------------------------------
[bigquery]
enabled = true
project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
job_project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
# location = "US"
# Venta: por defecto se lee la tabla de venta retail que usa Forusight (ForusIQ):
#   forus-analitica-prod-datalake.silver.ft_pe_venta_retail
# (fecmov_lv, nombre_tienda, venta_total_con_iva, nrodoc_lv, rutcli_lv, unidades_venta).
# La venta es BRUTA (con IGV): sin ventas_col_monto se usa venta_total_con_iva (o la primera columna
# bruta que exista). No pongas aquí una columna sin IGV.
# Se usa una clave propia para no chocar con el `ventas_table` de ForusIQ, que apunta a otra tabla.
# ventas_retail_table = "forus-analitica-prod-datalake.silver.ft_pe_venta_retail"
# ventas_col_monto = "venta_total_con_iva"

# Venta del año anterior cargada a mano (Azaleia) desde la sección Diagnóstico (?diagnostico=1).
# Tabla donde se guarda (la cuenta de servicio necesita permiso de escritura en el dataset). Sin
# esta clave se guarda en el servidor y se pierde al reiniciar la app.
# venta_ly_table = "PROYECTO.DATASET.concurso_navidad_venta_ly"

# Boletas nacionales de las tiendas de turistas (base del % de fidelización), cargadas en Diagnóstico.
# Sin esta clave se guardan en el servidor y se pierden al reiniciar (queda datos/boletas_nacionales.csv).
# boletas_nacionales_table = "PROYECTO.DATASET.concurso_navidad_boletas_nacionales"

# Presupuesto diario por tienda (PENDIENTE: falta el nombre de la tabla).
# presupuesto_table = "PROYECTO.DATASET.TABLA_PRESUPUESTO"
# presupuesto_col_fecha = "fecha"
# presupuesto_col_tienda = "tienda"
# presupuesto_col_valor = "presupuesto"

[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "tu-service-account@tu-project.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."
